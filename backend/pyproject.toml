[project]
name = "domain-health"
version = "0.1.0"
description = "A daily email-domain health check for many clients."
requires-python = ">=3.14"
dependencies = [
    "dnspython>=2.9.2",
    "fastapi>=0.165.0",
    "google-auth>=2.62.2",
    "google-cloud-firestore>=2.34.1",
    "google-cloud-tasks>=2.26.0",
    "httpx2>=2.16.2",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.4,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
live = [
    "openai>=3.55.1",
]

[tool.uv]
# Installed for development and CI, so the live model's module is linted, typed and tested
# against a fake. The production image installs neither group.
default-groups = ["dev", "live"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "S", "PT", "TID"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, and read fixed local paths.
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.14"
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -q"
markers = [
    "emulator: needs the Firestore emulator; `make check` runs these inside it. Outside it they fail on purpose, never skip: use -m 'not emulator'",
]
