# The four bars from docs/SPEC.md ("The measures"). Each is measured over three live runs of all
# the cases. The owner's: a phase does not edit them.

[coverage]
# Expected risks found in the first five returned, divided by expected risks, summed over the
# cases; the mean of the runs. Dropped output found nothing.
op = ">="
value = 0.80

[precision]
# Of the first five returned, those expected or acceptable, divided by the number returned; the
# mean of the runs.
op = ">="
value = 0.80

[harmful]
# Returned risks whose type is in the case's wrong list, counted over everything returned (up to
# eight) and over all runs.
op = "=="
value = 0

[stability]
# The share of cases whose set of first five IDs is identical in all runs. Dropped output never
# matches.
op = ">="
value = 0.90
